[project]
name = "dusken"
version = "0.1.0"
description = ""
authors = [{ name = "EDB", email = "edb@neuf.no" }]
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "argon2-cffi==25.1.*",
    "dj-database-url==3.1.*",
    "Django==6.1.*",
    "django-bootstrap5==26.*",
    "django-countries==9.*",
    "django-extensions==4.1.*",
    "django-filter==26.*",
    "django-inline-svg==0.1.*",
    "django-ldapdb",  # pinned to a git rev in [tool.uv.sources]
    "django-mptt==0.20.*",
    "django-oauth-toolkit==3.*",
    "django-ox==1.9.*",
    "django-phonenumber-field==8.*",
    "django-recaptcha==4.*",
    "django-redis==7.0.*",
    "django-tomselect==2026.*",
    "django-signal-disabler==0.1.*",
    "djangorestframework==3.18.*",
    "fabric==3.*",
    "gunicorn==26.*",
    "Markdown==3.11.*",
    "mysqlclient==2.*",
    "passlib==1.7.*",
    "phonenumbers==9.*",
    "psycopg==3.3.*",
    "redis==7.*",
    "requests==2.34.*",
    "sentry-sdk==2.72.*",
    "strawberry-graphql==0.336.*",
    "strawberry-graphql-django==0.93.*",
    "stripe==14.*",
    "nh3==0.3.*",
    "whitenoise==6.*",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]==6.1.*",
    "django-upgrade==1.33.*",
    "djangorestframework-stubs[compatible-mypy]==3.18.*",
    "pytest==9.*",
    "pytest-cov==7.*",
    "pytest-django==4.*",
    "pytest-socket==0.8.*",
    "requests-mock==1.12.*",
    "ruff==0.17.1",
    "types-jwcrypto==1.*",
    "types-requests==2.*",
]

[tool.uv.sources]
django-ldapdb = { git = "https://github.com/nikolaik/django-ldapdb", rev = "nikolaik/django-42" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dusken.settings.dev"
addopts = "--disable-socket"

[tool.coverage.run]
omit = [
    "dusken/migrations/*",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",               # pydocstyle: Allow undocumented code
  "ANN",             # flake8-annotations: Allow untyped code
  "TD", "FIX",       # Allow TODOs and FIXMEs
  "RUF012",          # FIXME: Fix later https://docs.astral.sh/ruff/rules/mutable-class-default/
  "FBT002",          # Allow boolean args
  "G004",            # Allow logging using f-string
  "EM101", "EM102",  # Allow string in exceptions (prioritice code readability vs exception time readability)
  "TRY003",          # Allow long exception messages
  "E501",            # Allow long lines
  "COM812", "ISC001", # Avoid conflicting with ruff formatter
  "CPY001",          # Allow files without copyright notice
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
# Testing code can deviate a bit more
"dusken/tests/*.py" = ["S101", "S106", "PLR2004", "ARG001"]
"**/test_*.py" = ["S101", "S106", "PLR2004", "ARG001"]
"**/tests.py" = ["S101", "S106", "PLR2004", "ARG001"]

[tool.mypy]
disable_error_code = "annotation-unchecked"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main", "strawberry.ext.mypy_plugin"]

[[tool.mypy.overrides]]
module = [
    "django_recaptcha.*",
    "dj_database_url.*",
    "django_filters.*",
    "django_tomselect.*",
    "fabric.*",
    "ldap",
    "ldap.*",
    "ldapdb.*",
    "mptt.*",
    "oauth2_provider.*",
    "passlib.*",
    "phonenumber_field.*",
]
ignore_missing_imports = true

# Each developer's own untracked settings, absent in CI
[[tool.mypy.overrides]]
module = "dusken.settings.local"
ignore_errors = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "dusken.settings.dev"
